# /etc/nginx/sites-available/prevoir  (then: ln -s to sites-enabled, nginx -t, systemctl reload nginx)
# Replace yourdomain.com with your domain. Certbot adds the HTTPS part for you.
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # needed so cookies get the Secure flag
    }
}
